name: Release Charts

on:
  push:
    paths:
      - 'charts/**'
      - '.github/workflows/publish-charts.yaml'
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.5.4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (lint)
        run: |
          ct lint --config ct.yaml

  release-charts:
    runs-on: ubuntu-latest
    needs:
      - lint-charts
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: "${{ github.repository_owner }}/opstree-redis-operator"
          path: "opstree-redis-operator"
          fetch-depth: 0

      - name: Get chart version
        run: |
          echo "chart_version=$(echo ${GITHUB_REF##*/v})" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Make charts
        shell: bash
        working-directory: opstree-redis-operator
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

          chart_dirs=("redis-operator" "redis" "redis-cluster" "redis-replication" "redis-sentinel")
          for dir in "${chart_dirs[@]}"
          do
            if [[ -f ./charts/$dir/Chart.yaml ]]; then
              helm dependency update ./charts/$dir/
            fi
            helm package charts/$dir -d .cr-release-packages
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to OCI registry (ghcr.io)
        shell: bash
        working-directory: opstree-redis-operator
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" "oci://ghcr.io/mvasilenko/opstree-redis-operator/charts"
          done
